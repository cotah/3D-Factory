[project]
name = "print3d-backend"
version = "0.1.0"
description = "Print3D Platform — backend (FastAPI + SQLModel)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "celery>=5.3",
    "redis>=5.0",
    "anthropic>=0.40",
    "openai>=1.58",
    "loguru>=0.7",
    "boto3>=1.34",
    "aiosmtplib>=3.0",
    "trimesh>=4.4",
    "numpy>=1.26",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

# This project is an application, not an installable library — tell uv not to
# try to build it as a package (avoids "no build backend" errors).
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/*", "tests/*"]
