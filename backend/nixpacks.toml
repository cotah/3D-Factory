# Nixpacks build for Railway. The base image has neither uv nor pip on PATH,
# so we provide Python 3.11 + uv (+ gcc for any C extensions) via nix.
[phases.setup]
nixPkgs = ["python311", "uv", "gcc"]

[phases.install]
cmds = ["uv sync --frozen"]

[start]
cmd = "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
