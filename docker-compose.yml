services:
  postgres:
    image: postgres:16-alpine
    container_name: print3d_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: print3d
      POSTGRES_PASSWORD: print3d
      POSTGRES_DB: print3d
    ports:
      - "5432:5432"
    volumes:
      - print3d_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U print3d"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: print3d_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - print3d_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  print3d_pg_data:
  print3d_redis_data:
